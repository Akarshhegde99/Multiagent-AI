<!-- templates/report_template.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MultiAgent AI Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1, h2 { color: #4CAF50; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 12px; }
        th { background-color: #f2f2f2; }
        .section { margin-top: 40px; }
    </style>
</head>
<body>
    <h1>📄 MultiAgent AI Report</h1>

    <div class="section">
        <h2>Data Preview</h2>
        {{ data_html | safe }}
    </div>

    <div class="section">
        <h2>Data Summary</h2>
        {{ summary_html | safe }}
    </div>

    <div class="section">
        <h2>AI Insights</h2>
        <p>{{ ai_insights }}</p>
    </div>
</body>
</html>
